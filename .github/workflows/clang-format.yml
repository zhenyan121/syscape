name: Clang Format

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22
          sudo ln -sf /usr/bin/clang-format-22 /usr/bin/clang-format
          sudo ln -sf /usr/bin/git-clang-format-22 /usr/bin/git-clang-format
          clang-format --version

      - name: Check changed C++ lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          FORMAT_STATUS=0
          FORMAT_DIFF="$(git clang-format \
            --binary clang-format-22 \
            --diff \
            --style file \
            --extensions cpp,hpp \
            "$BASE_SHA" HEAD)" || FORMAT_STATUS=$?
          if [[ $FORMAT_STATUS -ne 0 || \
                ( -n "$FORMAT_DIFF" && \
                  "$FORMAT_DIFF" != "no modified files to format" && \
                  "$FORMAT_DIFF" != "clang-format did not modify any files" ) ]]; then
            printf '%s\n' "$FORMAT_DIFF"
            exit 1
          fi
