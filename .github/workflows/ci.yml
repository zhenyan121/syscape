name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build

      - name: Configure CMake (Strict C++17 Hosted + C++11 Freestanding)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Examples
        run: |
          ./build/examples/example_system_overview >/dev/null
          ./build/examples/example_hardware_inventory >/dev/null
          ./build/examples/example_network_overview >/dev/null
          ./build/examples/example_filesystem_storage >/dev/null
          ./build/examples/example_security_virtualization >/dev/null
          ./build/examples/example_peripherals_multimedia >/dev/null
          ./build/examples/example_process_monitor >/dev/null
          ./build/examples/example_software_inventory >/dev/null

  linux-clang-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build

      - name: Configure CMake with ASan + UBSan
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-asan -j

      - name: Run Tests with Sanitizers
        run: ctest --test-dir build-asan --output-on-failure

      - name: Run Examples with Sanitizers
        run: |
          ./build-asan/examples/example_system_overview >/dev/null
          ./build-asan/examples/example_hardware_inventory >/dev/null
          ./build-asan/examples/example_network_overview >/dev/null
          ./build-asan/examples/example_filesystem_storage >/dev/null
          ./build-asan/examples/example_security_virtualization >/dev/null
          ./build-asan/examples/example_peripherals_multimedia >/dev/null
          ./build-asan/examples/example_process_monitor >/dev/null
          ./build-asan/examples/example_software_inventory >/dev/null

  openharmony-backend-host-check:
    name: OpenHarmony backend host check (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc g++ cmake ninja-build

      - name: Configure OpenHarmony backend host checks
        run: |
          cmake -B build-openharmony -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOHOS=ON \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-openharmony -j

      - name: Run OpenHarmony backend host tests
        run: |
          ctest \
            --test-dir build-openharmony \
            --output-on-failure \
            -R openharmony

      - name: Verify pkg-config dynamic-loader linkage
        run: |
          grep -Fx "Libs: -ldl" build-openharmony/syscape.pc

  aix-backend-host-check:
    name: AIX backend host check (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc g++ cmake ninja-build

      - name: Configure AIX backend host checks
        run: |
          cmake -B build-aix -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAIX=ON \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-aix -j

      - name: Run AIX backend host tests
        run: |
          ctest \
            --test-dir build-aix \
            --output-on-failure \
            -R _aix

  android-ndk-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ndk: 27.3.13750724
          script: bash .github/scripts/android-ci.sh

  windows-msvc:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC strict conformance)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Examples
        run: |
          ./build/examples/Release/example_system_overview.exe >/dev/null
          ./build/examples/Release/example_hardware_inventory.exe >/dev/null
          ./build/examples/Release/example_network_overview.exe >/dev/null
          ./build/examples/Release/example_filesystem_storage.exe >/dev/null
          ./build/examples/Release/example_security_virtualization.exe >/dev/null
          ./build/examples/Release/example_peripherals_multimedia.exe >/dev/null
          ./build/examples/Release/example_process_monitor.exe >/dev/null
          ./build/examples/Release/example_software_inventory.exe >/dev/null

  macos-apple-clang:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Examples
        run: |
          ./build/examples/example_system_overview >/dev/null
          ./build/examples/example_hardware_inventory >/dev/null
          ./build/examples/example_network_overview >/dev/null
          ./build/examples/example_filesystem_storage >/dev/null
          ./build/examples/example_security_virtualization >/dev/null
          ./build/examples/example_peripherals_multimedia >/dev/null
          ./build/examples/example_process_monitor >/dev/null
          ./build/examples/example_software_inventory >/dev/null

  apple-mobile-sdk:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sdk: iphoneos
            target: arm64-apple-ios15.0
          - platform: tvOS
            sdk: appletvos
            target: arm64-apple-tvos15.0
          - platform: watchOS
            sdk: watchos
            target: arm64-apple-watchos8.0
          - platform: visionOS
            sdk: xros
            target: arm64-apple-xros1.0
          - platform: Mac Catalyst
            sdk: macosx
            target: arm64-apple-ios15.0-macabi
    name: Apple Mobile SDK (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Strictly compile Apple Mobile tests
        run: |
          bash .github/scripts/apple-mobile-ci.sh \
            "${{ matrix.sdk }}" \
            "${{ matrix.target }}"

      - name: Configure iOS Simulator CMake project
        if: matrix.platform == 'iOS'
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=OFF

      - name: Build iOS Simulator CMake project
        if: matrix.platform == 'iOS'
        run: cmake --build build-ios --config Debug --parallel

  freebsd-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: "14.4"
          prepare: |
            pkg install -y cmake ninja
          run: |
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSYSCAPE_BUILD_TESTS=ON \
              -DSYSCAPE_BUILD_EXAMPLES=ON
            cmake --build build -j
            ctest --test-dir build --output-on-failure
            ./build/examples/example_system_overview >/dev/null
            ./build/examples/example_hardware_inventory >/dev/null
            ./build/examples/example_network_overview >/dev/null
            ./build/examples/example_filesystem_storage >/dev/null
            ./build/examples/example_security_virtualization >/dev/null
            ./build/examples/example_peripherals_multimedia >/dev/null
            ./build/examples/example_process_monitor >/dev/null
            ./build/examples/example_software_inventory >/dev/null

  openbsd-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.8"
          prepare: |
            pkg_add cmake ninja
          run: |
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSYSCAPE_BUILD_TESTS=ON \
              -DSYSCAPE_BUILD_EXAMPLES=ON
            cmake --build build -j
            ctest --test-dir build --output-on-failure
            ./build/examples/example_system_overview >/dev/null
            ./build/examples/example_hardware_inventory >/dev/null
            ./build/examples/example_network_overview >/dev/null
            ./build/examples/example_filesystem_storage >/dev/null
            ./build/examples/example_security_virtualization >/dev/null
            ./build/examples/example_peripherals_multimedia >/dev/null
            ./build/examples/example_process_monitor >/dev/null
            ./build/examples/example_software_inventory >/dev/null

  netbsd-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test with GCC in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          sync-time: true
          prepare: |
            /usr/sbin/pkg_add cmake ninja-build
          run: |
            export CC=/usr/bin/gcc
            export CXX=/usr/bin/g++
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=/usr/bin/gcc \
              -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
              -DSYSCAPE_BUILD_TESTS=ON \
              -DSYSCAPE_BUILD_EXAMPLES=ON
            cmake --build build -j
            ctest --test-dir build --output-on-failure
            ./build/examples/example_system_overview >/dev/null
            ./build/examples/example_hardware_inventory >/dev/null
            ./build/examples/example_network_overview >/dev/null
            ./build/examples/example_filesystem_storage >/dev/null
            ./build/examples/example_security_virtualization >/dev/null
            ./build/examples/example_peripherals_multimedia >/dev/null
            ./build/examples/example_process_monitor >/dev/null
            ./build/examples/example_software_inventory >/dev/null

  netbsd-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test with Clang in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.1"
          sync-time: true
          prepare: |
            /usr/sbin/pkg_add cmake ninja-build clang
          run: |
            export CC=clang
            export CXX=clang++
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DSYSCAPE_BUILD_TESTS=ON \
              -DSYSCAPE_BUILD_EXAMPLES=ON
            cmake --build build -j
            ctest --test-dir build --output-on-failure
            ./build/examples/example_system_overview >/dev/null
            ./build/examples/example_hardware_inventory >/dev/null
            ./build/examples/example_network_overview >/dev/null
            ./build/examples/example_filesystem_storage >/dev/null
            ./build/examples/example_security_virtualization >/dev/null
            ./build/examples/example_peripherals_multimedia >/dev/null
            ./build/examples/example_process_monitor >/dev/null
            ./build/examples/example_software_inventory >/dev/null

  dragonflybsd-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in DragonFly BSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          usesh: true
          release: "6.4.2"
          prepare: |
            pkg install -y cmake ninja
          run: |
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSYSCAPE_BUILD_TESTS=ON \
              -DSYSCAPE_BUILD_EXAMPLES=ON
            cmake --build build -j
            ctest --test-dir build --output-on-failure
            ./build/examples/example_system_overview >/dev/null
            ./build/examples/example_hardware_inventory >/dev/null
            ./build/examples/example_network_overview >/dev/null
            ./build/examples/example_filesystem_storage >/dev/null
            ./build/examples/example_security_virtualization >/dev/null
            ./build/examples/example_peripherals_multimedia >/dev/null
            ./build/examples/example_process_monitor >/dev/null
            ./build/examples/example_software_inventory >/dev/null

  openindiana-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in OpenIndiana (illumos) VM
        uses: vmactions/openindiana-vm@v1
        with:
          prepare: |
            pkg install --accept cmake ninja gcc-13
          run: |
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSYSCAPE_BUILD_TESTS=ON \
              -DSYSCAPE_BUILD_EXAMPLES=ON
            cmake --build build -j
            ctest --test-dir build --output-on-failure
            ./build/examples/example_system_overview >/dev/null
            ./build/examples/example_hardware_inventory >/dev/null
            ./build/examples/example_network_overview >/dev/null
            ./build/examples/example_filesystem_storage >/dev/null
            ./build/examples/example_security_virtualization >/dev/null
            ./build/examples/example_peripherals_multimedia >/dev/null
            ./build/examples/example_process_monitor >/dev/null
            ./build/examples/example_software_inventory >/dev/null

  haiku-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in Haiku VM
        uses: vmactions/haiku-vm@v1
        with:
          release: "r1beta5"
          run: |
            sh .github/scripts/haiku-ci.sh
