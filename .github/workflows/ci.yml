          emcmake cmake -B build-emscripten -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CROSSCOMPILING_EMULATOR="$(command -v node)" \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-emscripten -j

      - name: Run Emscripten tests with Node.js
        run: |
          ctest \
            --test-dir build-emscripten \
            --output-on-failure \
            -R emscripten

  android-ndk-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          ndk: 27.3.13750724
          script: bash .github/scripts/android-ci.sh

  windows-msvc:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC strict conformance)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSYSCAPE_BUILD_TESTS=ON \
            -DSYSCAPE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Examples
        run: |
          ./build/examples/Release/example_system_overview.exe >/dev/null
          ./build/examples/Release/example_hardware_inventory.exe >/dev/null
          ./build/examples/Release/example_network_overview.exe >/dev/null
          ./build/examples/Release/example_filesystem_storage.exe >/dev/null
          ./build/examples/Release/example_security_virtualization.exe >/dev/null
          ./build/examples/Release/example_peripherals_multimedia.exe >/dev/null
          ./build/examples/Release/example_process_monitor.exe >/dev/null
          ./build/examples/Release/example_software_inventory.exe >/dev/null

